<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 flex justify-center items-center min-h-screen overflow-hidden">

    <div class="bg-white w-full max-w-[400px] p-6 rounded-3xl shadow-2xl">

        <div class="flex justify-center">

            <div class="bg-blue-100 w-14 h-14 rounded-2xl flex justify-center items-center">
                <image src="images/profile.png"></image>
            </div>

        </div>

        <div class="text-center mt-4">

            <h1 class="text-3xl font-bold">
                Create Account
            </h1>

            <p class="text-gray-400 mt-1 text-sm">
                Join us today! It only takes a minute.
            </p>

        </div>

        <form class="mt-5 flex flex-col gap-4">


            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-3">


                <div class="grid grid-cols-1">

                    <label class="font-bold text-sm">Full Name</label>

                    <input type="text" placeholder="John Doe"
                        class="w-full bg-gray-100 border border-gray-200 rounded-xl py-3 px-3 mt-2 text-sm ">

                </div>


                <div class="grid grid-cols-1">

                    <label class="font-bold text-sm">Email Address</label>

                    <input type="email" placeholder="name@company.com"
                        class="w-full bg-gray-100 border border-gray-200 rounded-xl py-3 px-3 mt-2 text-sm">

                </div>

            </div>


            <div class="mt-3">

                <label class="font-bold text-sm">Password</label>

                <input type="password" placeholder="*********"
                    class="w-full bg-gray-100 border border-gray-200 rounded-xl py-2 px-3 mt-2 ">

            </div>


            <div class="mt-3">

                <label class="font-bold text-sm">
                    Confirm Password
                </label>

                <input type="password" placeholder="••••••••"
                    class="w-full bg-gray-100 border border-gray-200 rounded-xl py-2 px-3 mt-2 ">

            </div>


            <div class="flex gap-2 mt-4">

                <input type="checkbox">

                <p class="text-sm text-gray-500">
                    I agree to the

                    <a href="#" class="text-blue-600 font-semibold">
                        Terms of service
                    </a>

                    and

                    <a href="#" class="text-blue-600 font-semibold">
                        Privacy Policy
                    </a>

                </p>

            </div>


            <div class="mt-5">

                <a href="create.html">

                    <button class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">
                        Create My Account >>
                    </button>

                </a>

            </div>


            <div class="text-center mt-4">

                <p class="text-gray-400 text-sm">
                    Already have an account?

                    <a href="login.html" class="text-blue-600 font-semibold">
                        Sign in here
                    </a>
                </p>

            </div>

        </form>

    </div>

</body>

</html>
